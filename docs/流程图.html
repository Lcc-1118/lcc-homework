<html style="margin:0;padding:0;">
<title>仓内拣选与装车核验 · 全流程流程图（含判断与分流）</title>
<div style="width:100%;box-sizing:border-box;background:#f6f7f9;padding:20px;font-family:'Microsoft YaHei','PingFang SC',system-ui,sans-serif;color:#1a2433;line-height:1.4;">

  <div style="max-width:860px;margin:0 auto;">
    <div style="font-size:22px;font-weight:700;color:#123c63;margin-bottom:2px;">仓内拣选与装车核验 · 全流程流程图</div>
    <div style="font-size:13px;color:#5a6b82;margin-bottom:14px;">远川物流 · FDE 项目 · 证据 f00~f55 · 合成业务场景（示意）</div>

    <!-- 图例 -->
    <div style="display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px;font-size:12px;color:#33445c;">
      <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:18px;height:10px;border-radius:5px;background:#ddeaf8;border:1px solid #6f9fd0;display:inline-block;"></span>处理步骤</span>
      <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:14px;height:14px;transform:rotate(45deg);background:#fff3e0;border:1px solid #e0953f;display:inline-block;"></span>判断决策</span>
      <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:20px;height:10px;border-radius:5px;background:#eef6ec;border:1px solid #6ba368;display:inline-block;"></span>开始 / 结束 / 分流</span>
      <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:12px;height:12px;border-radius:3px;background:#fdeaea;border:1px solid #d2696a;display:inline-block;"></span>异常 / 转人工</span>
    </div>

    <svg viewBox="0 0 720 1010" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block;background:#fff;border:1px solid #d4dde8;border-radius:10px;">
      <defs>
        <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
          <path d="M0,0 L0,6 L7,3 z" fill="#4a5a70"/>
        </marker>
        <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
          <path d="M0,0 L0,6 L7,3 z" fill="#c0504d"/>
        </marker>
      </defs>

      <!-- ============ 主链 x≈210 ============ -->

      <!-- 1 开始椭圆 -->
      <ellipse cx="210" cy="45" rx="95" ry="26" fill="#eef6ec" stroke="#6ba368" stroke-width="1.5"/>
      <text x="210" y="40" font-size="13" font-weight="700" fill="#2f6e46" text-anchor="middle">开始 · 订单归集</text>
      <text x="210" y="56" font-size="11" fill="#4a7a57" text-anchor="middle">OMS 订单 · 顾明岚</text>

      <!-- 2 波次分配 -->
      <rect x="120" y="95" width="180" height="48" rx="6" fill="#ddeaf8" stroke="#6f9fd0" stroke-width="1.5"/>
      <text x="210" y="116" font-size="13" font-weight="700" fill="#123c63" text-anchor="middle">波次分配</text>
      <text x="210" y="132" font-size="11" fill="#3a5a80" text-anchor="middle">唐映秋（波次计划员）</text>

      <!-- 3 菱形① 取消单? -->
      <polygon points="210,158 320,205 210,252 100,205" fill="#fff3e0" stroke="#e0953f" stroke-width="1.5"/>
      <text x="210" y="200" font-size="12" font-weight="700" fill="#8a5a15" text-anchor="middle">波次含</text>
      <text x="210" y="215" font-size="12" font-weight="700" fill="#8a5a15" text-anchor="middle">取消单?</text>

      <!-- 是 → 分支 -->
      <line x1="320" y1="205" x2="470" y2="205" stroke="#c0504d" stroke-width="1.5" marker-end="url(#arrowRed)"/>
      <text x="395" y="198" font-size="11" fill="#c0504d" text-anchor="middle">是</text>
      <!-- 拦截矩形 -->
      <rect x="400" y="181" width="160" height="48" rx="6" fill="#fdeaea" stroke="#d2696a" stroke-width="1.5"/>
      <text x="480" y="202" font-size="12" font-weight="700" fill="#8a2f2f" text-anchor="middle">取消订单拦截 REQ-1</text>
      <text x="480" y="218" font-size="10" fill="#9a4a4a" text-anchor="middle">f11·f31·f44</text>
      <!-- 转人工椭圆 -->
      <line x1="480" y1="229" x2="480" y2="262" stroke="#c0504d" stroke-width="1.5" marker-end="url(#arrowRed)"/>
      <ellipse cx="480" cy="285" rx="80" ry="22" fill="#fdeaea" stroke="#d2696a" stroke-width="1.5"/>
      <text x="480" y="290" font-size="12" font-weight="700" fill="#8a2f2f" text-anchor="middle">转人工确认</text>

      <!-- 否 → 下 -->
      <line x1="210" y1="252" x2="210" y2="288" stroke="#4a5a70" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="232" y="272" font-size="11" fill="#4a5a70">否</text>

      <!-- 4 拣选 -->
      <rect x="120" y="290" width="180" height="48" rx="6" fill="#ddeaf8" stroke="#6f9fd0" stroke-width="1.5"/>
      <text x="210" y="311" font-size="13" font-weight="700" fill="#123c63" text-anchor="middle">拣选</text>
      <text x="210" y="327" font-size="11" fill="#3a5a80" text-anchor="middle">林亦舟（拣货员）</text>

      <!-- 5 菱形② 相似SKU? -->
      <polygon points="210,353 320,400 210,447 100,400" fill="#fff3e0" stroke="#e0953f" stroke-width="1.5"/>
      <text x="210" y="395" font-size="11" font-weight="700" fill="#8a5a15" text-anchor="middle">相似SKU</text>
      <text x="210" y="410" font-size="11" font-weight="700" fill="#8a5a15" text-anchor="middle">相邻货位?</text>

      <!-- 是 → 错配提醒 -->
      <line x1="320" y1="400" x2="470" y2="400" stroke="#c0504d" stroke-width="1.5" marker-end="url(#arrowRed)"/>
      <text x="395" y="393" font-size="11" fill="#c0504d" text-anchor="middle">是</text>
      <rect x="400" y="376" width="160" height="48" rx="6" fill="#fdeaea" stroke="#d2696a" stroke-width="1.5"/>
      <text x="480" y="397" font-size="12" font-weight="700" fill="#8a2f2f" text-anchor="middle">错配提醒 REQ-2</text>
      <text x="480" y="413" font-size="10" fill="#9a4a4a" text-anchor="middle">f10·f52 不自动操作</text>
      <line x1="480" y1="424" x2="480" y2="455" stroke="#c0504d" stroke-width="1.5" marker-end="url(#arrowRed)"/>
      <ellipse cx="480" cy="478" rx="80" ry="22" fill="#fdeaea" stroke="#d2696a" stroke-width="1.5"/>
      <text x="480" y="483" font-size="12" font-weight="700" fill="#8a2f2f" text-anchor="middle">人工确认</text>

      <!-- 否 → 下 -->
      <line x1="210" y1="447" x2="210" y2="483" stroke="#4a5a70" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="232" y="467" font-size="11" fill="#4a5a70">否</text>

      <!-- 6 复核 -->
      <rect x="120" y="485" width="180" height="48" rx="6" fill="#ddeaf8" stroke="#6f9fd0" stroke-width="1.5"/>
      <text x="210" y="506" font-size="13" font-weight="700" fill="#123c63" text-anchor="middle">复核</text>
      <text x="210" y="522" font-size="11" fill="#3a5a80" text-anchor="middle">漏扫检查 · 目标35→20min</text>

      <!-- 7 菱形③ 复核通过? -->
      <polygon points="210,548 320,595 210,642 100,595" fill="#fff3e0" stroke="#e0953f" stroke-width="1.5"/>
      <text x="210" y="590" font-size="12" font-weight="700" fill="#8a5a15" text-anchor="middle">复核</text>
      <text x="210" y="605" font-size="12" font-weight="700" fill="#8a5a15" text-anchor="middle">漏扫=0?</text>

      <!-- 否 → 返工 -->
      <line x1="100" y1="595" x2="40" y2="595" stroke="#c0504d" stroke-width="1.5" marker-end="url(#arrowRed)"/>
      <text x="82" y="588" font-size="11" fill="#c0504d" text-anchor="middle">否</text>
      <ellipse cx="30" cy="632" rx="70" ry="22" fill="#fdeaea" stroke="#d2696a" stroke-width="1.5"/>
      <text x="30" y="637" font-size="12" font-weight="700" fill="#8a2f2f" text-anchor="middle">返工修正</text>
      <!-- 返工回拣选 -->
      <line x1="30" y1="654" x2="30" y2="680" stroke="#4a5a70" stroke-width="1.5"/>
      <line x1="30" y1="680" x2="150" y2="680" stroke="#4a5a70" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="88" y="672" font-size="10" fill="#4a5a70" text-anchor="middle">返工</text>

      <!-- 是 → 下 -->
      <line x1="210" y1="642" x2="210" y2="678" stroke="#4a5a70" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="232" y="662" font-size="11" fill="#4a5a70">是</text>

      <!-- 8 集货 -->
      <rect x="120" y="680" width="180" height="48" rx="6" fill="#ddeaf8" stroke="#6f9fd0" stroke-width="1.5"/>
      <text x="210" y="701" font-size="13" font-weight="700" fill="#123c63" text-anchor="middle">集货</text>
      <text x="210" y="717" font-size="11" fill="#3a5a80" text-anchor="middle">装车员</text>

      <!-- 9 装车扫码 -->
      <line x1="210" y1="728" x2="210" y2="760" stroke="#4a5a70" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="120" y="762" width="180" height="48" rx="6" fill="#ddeaf8" stroke="#6f9fd0" stroke-width="1.5"/>
      <text x="210" y="783" font-size="13" font-weight="700" fill="#123c63" text-anchor="middle">装车扫码</text>
      <text x="210" y="799" font-size="11" fill="#3a5a80" text-anchor="middle">装车员</text>

      <!-- 10 菱形④ 订单已取消? -->
      <polygon points="210,825 320,872 210,919 100,872" fill="#fff3e0" stroke="#e0953f" stroke-width="1.5"/>
      <text x="210" y="867" font-size="12" font-weight="700" fill="#8a5a15" text-anchor="middle">订单</text>
      <text x="210" y="882" font-size="12" font-weight="700" fill="#8a5a15" text-anchor="middle">已取消?</text>

      <!-- 是 → 拦截转人工 -->
      <line x1="320" y1="872" x2="470" y2="872" stroke="#c0504d" stroke-width="1.5" marker-end="url(#arrowRed)"/>
      <text x="395" y="865" font-size="11" fill="#c0504d" text-anchor="middle">是</text>
      <ellipse cx="480" cy="872" rx="85" ry="24" fill="#fdeaea" stroke="#d2696a" stroke-width="1.5"/>
      <text x="480" y="867" font-size="12" font-weight="700" fill="#8a2f2f" text-anchor="middle">拦截 · 转人工</text>
      <text x="480" y="883" font-size="10" fill="#9a4a4a" text-anchor="middle">REQ-1 · f44</text>

      <!-- 否 → 结束 -->
      <line x1="210" y1="919" x2="210" y2="952" stroke="#4a5a70" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="232" y="938" font-size="11" fill="#4a5a70">否</text>

      <!-- 11 结束椭圆 -->
      <ellipse cx="210" cy="980" rx="100" ry="28" fill="#eef6ec" stroke="#6ba368" stroke-width="1.5"/>
      <text x="210" y="974" font-size="13" font-weight="700" fill="#2f6e46" text-anchor="middle">结束 · 配送站收货</text>
      <text x="210" y="990" font-size="10" fill="#4a7a57" text-anchor="middle">验收：错发率↓ · 漏扫=0 · f02·f42</text>
    </svg>

    <div style="font-size:12px;color:#5a6b82;border-top:1px solid #d4dde8;margin-top:14px;padding-top:10px;">
      菱形为判断决策，椭圆为开始 / 结束 / 转人工分流终点；取消单、错配、漏扫异常均转人工兜底（f44），
      不自动操作、不写业务系统（f05、f32、f41、f52）。本项目为 FDE 合成业务场景（示意），真实接口需另行核实。
    </div>
  </div>
</div>
</html>
